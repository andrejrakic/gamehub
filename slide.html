<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klizne pločice</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🔢</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button,.home{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:22px;line-height:1;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
@keyframes hop{40%{transform:translateY(-10px) scale(1.08)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--s:min(90vw,440px)}
#b{position:relative;width:var(--s);height:var(--s);margin:30px auto;background:#243649;border-radius:12px}
.t{position:absolute;box-sizing:border-box;padding:3px;transition:left .15s,top .15s}
.t b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:12px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);
font-size:calc(var(--s) / var(--n) * .42);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.cheer .t b{animation:hop .6s ease both}

</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<div id="b"></div>
<div id="win"><div class="big">🎉</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const $=s=>document.querySelector(s);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let lvl=1,n=3,a=[],plan=[],hist=[],lock=false;
try{lvl=Math.max(1,+localStorage.getItem('c_lvl')||1)}catch(e){}
const B=$('#b'),dirs=()=>[-n,-1,n,1],opp=d=>(d+2)%4;   // directions of the empty cell: up, left, down, right
const snap=()=>({a:a.slice(),plan:plan.slice()});

function moveBlank(d){const b=a.indexOf(0),x=b%n,y=b/n|0;
  if((d==0&&!y)||(d==1&&!x)||(d==2&&y==n-1)||(d==3&&x==n-1))return false;
  const t=b+dirs()[d];[a[b],a[t]]=[a[t],a[b]];
  if(plan[0]==d)plan.shift();else plan.unshift(opp(d));return true}

// scramble by random slides from the solved board; the plan is that walk reversed
function gen(L){const r=rng(L*45589+9);n=L<=8?3:4;
  const k=n==3?Math.min(12+L*4,60):Math.min(24+(L-8)*5,80);
  a=[...Array(n*n).keys()].map(i=>(i+1)%(n*n));plan=[];
  let last=-1;const ms=[];
  for(let s=0;s<k;s++){const b=a.indexOf(0),x=b%n,y=b/n|0;
    const o=[0,1,2,3].filter(d=>!(last>=0&&d==opp(last))&&(d==0?y>0:d==1?x>0:d==2?y<n-1:x<n-1));
    const d=o[r()*o.length|0];const t=b+dirs()[d];[a[b],a[t]]=[a[t],a[b]];last=d;ms.push(d)}
  plan=ms.reverse().map(opp)}

const solved=()=>a.every((v,i)=>v==(i+1)%(n*n));

function build(){B.style.setProperty('--n',n);
  B.innerHTML=a.filter(v=>v).sort((x,y)=>x-y).map(v=>`<div class="t" data-v="${v}"><b style="background:hsl(${v*360/(n*n)} 62% 52%)">${v}</b></div>`).join('');
  place();$('#lv').textContent=lvl}
function place(){B.querySelectorAll('.t').forEach(e=>{const p=a.indexOf(+e.dataset.v);
  e.style.left=p%n/n*100+'%';e.style.top=(p/n|0)/n*100+'%';e.style.width=e.style.height=100/n+'%'})}

function check(){if(lock||!solved())return;lock=true;B.classList.add('cheer');
  setTimeout(()=>{B.classList.remove('cheer');lock=false;$('#win').classList.add('on')},1100)}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('c_lvl',lvl)}catch(e){}
  gen(lvl);hist=[];lock=false;$('#win').classList.remove('on');build()}

B.onpointerdown=e=>{if(lock)return;const t=e.target.closest('.t');if(!t)return;e.preventDefault();
  const p=a.indexOf(+t.dataset.v),b=a.indexOf(0);let d,steps;
  if((p/n|0)==(b/n|0)){d=p>b?3:1;steps=Math.abs(p-b)}
  else if(p%n==b%n){d=p>b?2:0;steps=Math.abs(p-b)/n}
  else return;
  hist.push(snap());for(let k=0;k<steps;k++)moveBlank(d);place();check()};
$('#undo').onclick=()=>{if(hist.length&&!lock){const s=hist.pop();a=s.a;plan=s.plan;place()}};
$('#redo').onclick=()=>{if(lock)return;hist.push(snap());gen(lvl);place()};
$('#prev').onclick=()=>load(lvl-1);
$('#next').onclick=()=>load(lvl+1);
$('#go').onclick=()=>load(lvl+1);
$('#hint').onclick=()=>{if(lock||!plan.length)return;hist.push(snap());moveBlank(plan[0]);place();check()};
load(lvl);

</script>
</body>
</html>
