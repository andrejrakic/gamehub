<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🔢</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;--s:min(94vw,440px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button,.home{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:22px;line-height:1;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
#g{display:grid;width:var(--s);margin:22px auto 16px;border:3px solid #12202f;border-radius:10px;overflow:hidden;box-sizing:border-box;background:#12202f}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;box-sizing:border-box;background:#34495f;color:#ffb74d;
font-size:calc(var(--s) / var(--n) * .5);font-weight:800;border:1px solid rgba(255,255,255,.12)}
.c.g{background:#26394e;color:#fff}
.c.s{background:#4f7aa6}
.c.bad{color:#ff6b6b;box-shadow:inset 0 0 0 3px #e53935}
#pad{display:flex;gap:6px;width:var(--s);justify-content:center}
#pad button{flex:1 1 0;min-width:0;max-width:60px;height:54px;border-radius:14px;border:0;background:var(--btn);color:#fff;font-size:24px;font-weight:800}
#pad button:active{transform:scale(.94)}
.cheer .c{animation:hop .7s ease both;animation-delay:calc(var(--i)*.08s)}
@keyframes hop{40%{transform:translateY(-10px) scale(1.08)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<div id="g"></div>
<div id="pad"></div>
<div id="win"><div class="big">🎉</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const $=s=>document.querySelector(s);
let lvl=1,n=4,br=2,bc=2,sol=[],giv=[],g=[],sel=-1,hist=[],lock=false;
try{lvl=Math.max(1,+localStorage.getItem('s_lvl')||1)}catch(e){}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function ok(a,i,v){const r=(i/n)|0,c=i%n;
  for(let k=0;k<n;k++){if(r*n+k!=i&&a[r*n+k]==v)return false;if(k*n+c!=i&&a[k*n+c]==v)return false}
  const r0=r-r%br,c0=c-c%bc;
  for(let y=0;y<br;y++)for(let x=0;x<bc;x++){const j=(r0+y)*n+c0+x;if(j!=i&&a[j]==v)return false}
  return true}

function cnt(a,lim,r){let c=0,f=null;
  const go=()=>{const i=a.indexOf(0);if(i<0){c++;f=f||a.slice();return}
    const vs=[...Array(n)].map((_,k)=>k+1);if(r)vs.sort(()=>r()-.5);
    for(const v of vs){if(!ok(a,i,v))continue;a[i]=v;go();a[i]=0;if(c>=lim)return}};
  go();return{c,f}}

const conf=()=>{const b=new Set();g.forEach((v,i)=>{if(v&&!ok(g,i,v))b.add(i)});return b};

function render(){const G=$('#g'),bad=conf();
  G.style.setProperty('--n',n);G.style.gridTemplateColumns=`repeat(${n},1fr)`;
  G.innerHTML=g.map((v,i)=>{const r=(i/n)|0,c=i%n,T='3px solid #12202f';
    return `<div class="c${giv[i]?' g':''}${i==sel?' s':''}${bad.has(i)?' bad':''}" data-i="${i}" style="${(c+1)%bc==0&&c<n-1?'border-right:'+T+';':''}${(r+1)%br==0&&r<n-1?'border-bottom:'+T+';':''}">${v||''}</div>`}).join('');
  $('#lv').textContent=lvl}

function check(){if(lock||g.some(v=>!v)||conf().size)return;lock=true;
  const G=$('#g');G.classList.add('cheer');
  [...G.children].forEach((e,i)=>e.style.setProperty('--i',i%n+((i/n)|0)));
  setTimeout(()=>{G.classList.remove('cheer');lock=false;$('#win').classList.add('on')},1400)}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('s_lvl',lvl)}catch(e){}
  const r=rng(lvl*7727+11);n=lvl<=6?4:6;br=2;bc=n/2;
  sol=cnt(Array(n*n).fill(0),1,r).f;
  const t=n==4?Math.min(6+lvl,11):Math.min(14+(lvl-6)*2,24),p=sol.slice();let d=0;
  for(const i of [...p.keys()].sort(()=>r()-.5)){if(d>=t)break;const v=p[i];p[i]=0;if(cnt(p.slice(),2).c==1)d++;else p[i]=v}
  giv=p.map(v=>v>0);g=p.slice();sel=-1;hist=[];
  $('#pad').innerHTML=[...Array(n)].map((_,k)=>`<button data-v="${k+1}">${k+1}</button>`).join('')+'<button data-v="0">⌫</button>';
  $('#win').classList.remove('on');render()}

function put(v){if(sel<0||lock||giv[sel])return;hist.push(g.slice());g[sel]=v;render();check()}

$('#g').onclick=e=>{const d=e.target.closest('.c');if(!d||lock)return;const i=+d.dataset.i;if(!giv[i]){sel=i;render()}};
$('#pad').onclick=e=>{const b=e.target.closest('button');if(b)put(+b.dataset.v)};
$('#undo').onclick=()=>{if(hist.length&&!lock){g=hist.pop();render()}};
$('#redo').onclick=()=>{if(lock)return;hist.push(g.slice());g=sol.map((v,i)=>giv[i]?v:0);render()};
$('#prev').onclick=()=>load(lvl-1);
$('#next').onclick=()=>load(lvl+1);
$('#go').onclick=()=>load(lvl+1);
$('#hint').onclick=()=>{if(lock)return;
  let i=sel>=0&&!giv[sel]?sel:g.findIndex((v,k)=>!giv[k]&&v&&v!=sol[k]);
  if(i<0)i=g.findIndex(v=>!v);if(i<0)return;
  hist.push(g.slice());sel=i;g[i]=sol[i];render();check()};
load(lvl);
</script>
</body>
</html>
