<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraljice</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>👑</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;--s:min(94vw,480px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:24px;line-height:1}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
.home{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--btn);color:var(--fg);font-size:22px;text-decoration:none}
#board{display:grid;width:var(--s);margin:26px auto;border:3px solid #12202f;border-radius:10px;overflow:hidden;box-sizing:border-box}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;box-sizing:border-box;color:rgba(0,0,0,.45);font-weight:800;
font-size:calc(var(--s) / var(--n) * .55);line-height:1}
.c.bad{box-shadow:inset 0 0 0 4px #e53935;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<div id="board"></div>
<div id="win"><div class="big">👑</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const COL=['#ef9a9a','#ffcc80','#fff176','#a5d6a7','#80deea','#90caf9','#ce93d8','#f8bbd0','#bcaaa4'];
const $=s=>document.querySelector(s);
let lvl=1,P,m=[],hist=[];
try{lvl=Math.max(1,+localStorage.getItem('q_lvl')||1)}catch(e){}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function place(n,r){const q=[];
  const go=row=>{if(row==n)return true;
    const cs=[...Array(n).keys()].sort(()=>r()-.5);
    for(const c of cs){if(q.slice(0,row).includes(c))continue;
      if(row&&Math.abs(c-q[row-1])<2)continue;
      q[row]=c;if(go(row+1))return true}
    q.length=row;return false};
  go(0);return q}

function grow(n,q,r){const g=Array.from({length:n},()=>Array(n).fill(-1));
  q.forEach((c,i)=>g[i][c]=i);let left=n*n-n;
  while(left){const cand=[];
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(g[i][j]<0){
      const nb=[[i-1,j],[i+1,j],[i,j-1],[i,j+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&g[a][b]>=0);
      if(nb.length)cand.push([i,j,nb])}
    const[i,j,nb]=cand[Math.floor(r()*cand.length)];
    const[a,b]=nb[Math.floor(r()*nb.length)];g[i][j]=g[a][b];left--}
  return g}

function count(n,reg){let k=0;const cols=[],ur=new Set();
  const go=row=>{if(k>1)return;if(row==n){k++;return}
    for(let c=0;c<n;c++){
      if(cols.slice(0,row).includes(c))continue;
      if(row&&Math.abs(c-cols[row-1])<2)continue;
      const g=reg[row][c];if(ur.has(g))continue;
      cols[row]=c;ur.add(g);go(row+1);ur.delete(g)}};
  go(0);return k}

function gen(L){const r=rng(L*104729+7),n=Math.min(4+((L-1)/3|0),9);let b;
  for(let t=0;t<500;t++){const q=place(n,r);b={n,q,reg:grow(n,q,r)};
    if(count(n,b.reg)==1)return b}
  return b}

function conflicts(){const Q=[],bad=new Set();
  m.forEach((row,i)=>row.forEach((v,j)=>{if(v==2)Q.push([i,j])}));
  for(let a=0;a<Q.length;a++)for(let b=a+1;b<Q.length;b++){
    const[i,j]=Q[a],[k,l]=Q[b];
    if(i==k||j==l||P.reg[i][j]==P.reg[k][l]||(Math.abs(i-k)<2&&Math.abs(j-l)<2)){bad.add(i+','+j);bad.add(k+','+l)}}
  return{Q,bad}}

function render(){const B=$('#board'),n=P.n,T='3px solid #12202f',S='1px solid rgba(0,0,0,.15)',g=P.reg;
  B.style.setProperty('--n',n);B.style.gridTemplateColumns=`repeat(${n},1fr)`;B.innerHTML='';
  const{bad}=conflicts();
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const d=document.createElement('div');
    d.className='c'+(bad.has(i+','+j)?' bad':'');
    d.style.background=COL[g[i][j]];
    d.style.borderTop=i&&g[i-1][j]==g[i][j]?S:(i?T:'0');
    d.style.borderLeft=j&&g[i][j-1]==g[i][j]?S:(j?T:'0');
    d.textContent=m[i][j]==1?'✕':m[i][j]==2?'👑':'';
    d.onclick=()=>{hist.push(m.map(x=>x.slice()));m[i][j]=(m[i][j]+1)%3;render();check()};
    B.appendChild(d)}
  $('#lv').textContent=lvl}

function check(){const{Q,bad}=conflicts();
  if(Q.length==P.n&&!bad.size)setTimeout(()=>$('#win').classList.add('on'),500)}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('q_lvl',lvl)}catch(e){}
  P=gen(lvl);m=Array.from({length:P.n},()=>Array(P.n).fill(0));hist=[];
  $('#win').classList.remove('on');render()}

$('#undo').onclick=()=>{if(hist.length){m=hist.pop();render()}};
$('#redo').onclick=()=>load(lvl);
$('#prev').onclick=()=>load(lvl-1);
$('#next').onclick=()=>load(lvl+1);
$('#go').onclick=()=>load(lvl+1);
$('#hint').onclick=()=>{hist.push(m.map(x=>x.slice()));
  for(let i=0;i<P.n;i++)for(let j=0;j<P.n;j++)if(m[i][j]==2&&P.q[i]!=j){m[i][j]=0;render();return}
  for(let i=0;i<P.n;i++)if(m[i][P.q[i]]!=2){m[i][P.q[i]]=2;render();check();return}};
load(lvl);
</script>
</body>
</html>
