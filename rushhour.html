<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rush Hour</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🚗</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button,.home{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:22px;line-height:1;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
@keyframes hop{40%{transform:translateY(-10px) scale(1.08)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--s:min(90vw,460px)}
#b{position:relative;width:var(--s);height:var(--s);margin:30px auto;background:#2a3f57;border-radius:12px;touch-action:none;
background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
background-size:calc(100% / 6) calc(100% / 6)}
.car{position:absolute;padding:3px;box-sizing:border-box;touch-action:none}
.car b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:12px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);font-size:26px;font-weight:400}
.ex{position:absolute;right:-9px;top:calc(100% / 3);width:9px;height:calc(100% / 6);background:#43c25a;border-radius:0 8px 8px 0}

.rules{width:min(92vw,440px);margin:6px auto 28px;background:rgba(255,255,255,.06);border-radius:16px;padding:4px 16px 12px;box-sizing:border-box;font-size:16px;line-height:1.35}
.rules summary{font-weight:800;font-size:18px;padding:10px 0;cursor:pointer}
.rules ul{margin:0;padding-left:20px}
.rules li{margin:6px 0}
.rules p{margin:10px 0 0;opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<div id="b"></div>
<details class="rules" open>
  <summary>Како се игра</summary>
  <ul>
    <li>Извуци црвени ауто са ⭐ на излаз са десне стране (означен зеленом).</li>
    <li>Аута се померају само право: водоравна лево–десно, усправна горе–доле.</li>
    <li>Вуци ауто прстом. Аута не могу један кроз други.</li>
  </ul>
  <p>💡 помоћ · ↶ врати потез · ↻ испочетка · ◀ ▶ нивои</p>
</details>
<div id="win"><div class="big">🏁</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const $=s=>document.querySelector(s);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let lvl=1,cars=[],hist=[],dg=null,lock=false;
try{lvl=Math.max(1,+localStorage.getItem('r_lvl')||1)}catch(e){}
const B=$('#b');
const COLS=['#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#f48fb1','#8d6e63','#9ccc65','#5c6bc0','#26a69a','#ffa726'];
const idx=(c,k)=>c.h?c.r*6+c.c+k:(c.r+k)*6+c.c;

function grid(cs,skip){const g=Array(36).fill(-1);
  cs.forEach((c,i)=>{if(i==skip)return;for(let k=0;k<c.len;k++)g[idx(c,k)]=i});return g}

function range(i){const g=grid(cars,i),c=cars[i];let lo=0,hi=0;
  const at=k=>c.h?(c.c+k>=0&&c.c+k<6?g[c.r*6+c.c+k]:99):(c.r+k>=0&&c.r+k<6?g[(c.r+k)*6+c.c]:99);
  while(at(c.len+hi)==-1)hi++;while(at(-1-lo)==-1)lo++;return[-lo,hi]}

// BFS over single-cell slides; red car is cars[0] and must reach column 4
function bfs(cs,cap=40000){const n=cs.length,pos0=cs.map(c=>c.h?c.c:c.r);
  const seen=new Set([pos0.join()]),Q=[pos0],par=[-1],mv=[null];
  for(let h=0;h<Q.length;h++){const p=Q[h];
    if(p[0]==4){const path=[];for(let k=h;par[k]>=0;k=par[k])path.push(mv[k]);return path.reverse()}
    if(Q.length>cap)return null;
    const g=Array(36).fill(-1);
    cs.forEach((c,i)=>{for(let k=0;k<c.len;k++)g[c.h?c.r*6+p[i]+k:(p[i]+k)*6+c.c]=i});
    for(let i=0;i<n;i++){const c=cs[i];
      for(const d of[-1,1]){const q=p[i]+d;if(q<0||q+c.len>6)continue;
        const cell=d<0?q:q+c.len-1;
        if(g[c.h?c.r*6+cell:cell*6+c.c]!=-1)continue;
        const np=p.slice();np[i]=q;const key=np.join();
        if(seen.has(key))continue;seen.add(key);Q.push(np);par.push(h);mv.push([i,d])}}}
  return null}

function gen(L){const r=rng(L*60013+17),want=Math.min(6+Math.floor(L*1.8),50),nc=Math.min(5+(L>>1),11);
  let best=null,bl=-1;
  for(let t=0;t<40;t++){
    const cs=[{r:2,c:r()*3|0,len:2,h:true}];
    for(let k=0;k<80&&cs.length<nc;k++){
      const h=r()<.5,len=r()<.25?3:2,rr=r()*6|0,cc=r()*6|0;
      if(h&&rr==2)continue;if(h?cc+len>6:rr+len>6)continue;
      const g=grid(cs,-1);let ok=true;
      for(let j=0;j<len;j++)if(g[h?rr*6+cc+j:(rr+j)*6+cc]!=-1)ok=false;
      if(ok)cs.push({r:rr,c:cc,len,h})}
    const p=bfs(cs);if(!p)continue;
    if(p.length>bl){bl=p.length;best=cs}
    if(p.length>=want)break}
  return best||[{r:2,c:0,len:2,h:true}]}

const snap=()=>cars.map(c=>[c.r,c.c]);

function render(){
  B.innerHTML='<i class="ex"></i>'+cars.map((c,i)=>{const w=c.h?c.len:1,h=c.h?1:c.len;
    return `<div class="car" data-i="${i}" style="left:${c.c/6*100}%;top:${c.r/6*100}%;width:${w/6*100}%;height:${h/6*100}%"><b style="background:${i?COLS[(i-1)%COLS.length]:'#e53935'}">${i?'':'⭐'}</b></div>`}).join('');
  $('#lv').textContent=lvl}

function check(){if(cars[0].c!=4||lock)return;lock=true;
  const e=B.querySelector('[data-i="0"]'),cs=B.clientWidth/6;
  e.style.transition='transform .7s ease-in';e.style.transform=`translateX(${2.4*cs}px)`;
  setTimeout(()=>{lock=false;$('#win').classList.add('on')},1100)}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('r_lvl',lvl)}catch(e){}
  cars=gen(lvl);hist=[];$('#win').classList.remove('on');render()}

B.onpointerdown=e=>{if(lock)return;const el=e.target.closest('.car');if(!el)return;
  e.preventDefault();B.setPointerCapture(e.pointerId);
  const i=+el.dataset.i,[lo,hi]=range(i);dg={i,el,x:e.clientX,y:e.clientY,cs:B.clientWidth/6,lo,hi,d:0}};
B.onpointermove=e=>{if(!dg)return;const c=cars[dg.i];
  let d=(c.h?e.clientX-dg.x:e.clientY-dg.y)/dg.cs;d=Math.max(dg.lo,Math.min(dg.hi,d));dg.d=d;
  dg.el.style.transform=c.h?`translateX(${d*dg.cs}px)`:`translateY(${d*dg.cs}px)`};
B.onpointerup=B.onpointercancel=()=>{if(!dg)return;const c=cars[dg.i],m=Math.round(dg.d);dg=null;
  if(m){hist.push(snap());if(c.h)c.c+=m;else c.r+=m}
  render();check()};

$('#undo').onclick=()=>{if(hist.length&&!lock){hist.pop().forEach(([r,c],i)=>{cars[i].r=r;cars[i].c=c});render()}};
$('#redo').onclick=()=>{if(lock)return;hist.push(snap());cars=gen(lvl);render()};
$('#prev').onclick=()=>load(lvl-1);
$('#next').onclick=()=>load(lvl+1);
$('#go').onclick=()=>load(lvl+1);
$('#hint').onclick=()=>{if(lock)return;const p=bfs(cars);if(!p||!p.length)return;
  const[i,d]=p[0];let k=1;while(p[k]&&p[k][0]==i&&p[k][1]==d)k++;
  hist.push(snap());cars[i][cars[i].h?'c':'r']+=d*k;render();check()};
load(lvl);

</script>
</body>
</html>
