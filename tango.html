<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tango</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>☀️</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;--s:min(92vw,440px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button,.home{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:22px;line-height:1;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
#g{display:grid;gap:5px;width:var(--s);margin:30px auto}
.c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#34495f;border-radius:10px;
font-size:calc(var(--s) / var(--n) * .55);line-height:1}
.c.g{background:#1f3144}
.c.bad{box-shadow:inset 0 0 0 3px #e53935}
.k{position:absolute;width:20px;height:20px;border-radius:50%;background:#12202f;border:2px solid #fff;color:#fff;font-size:14px;font-weight:900;
font-style:normal;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;font-family:system-ui,sans-serif}
.k.r{right:-12px;top:calc(50% - 10px)}
.k.d{bottom:-12px;left:calc(50% - 10px)}
.cheer .c{animation:hop .7s ease both;animation-delay:calc(var(--i)*.08s)}
@keyframes hop{40%{transform:translateY(-10px) scale(1.08)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<div id="g"></div>
<div id="win"><div class="big">☀️</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const $=s=>document.querySelector(s);
let lvl=1,n=4,sol=[],giv=[],cons=[],g=[],hist=[],lock=false;
try{lvl=Math.max(1,+localStorage.getItem('t_lvl')||1)}catch(e){}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// 0 = sun, 1 = moon. cons: [a, b, 0 equal | 1 different], a < b, neighbours.
function solve(n,gv,cs,lim,r){const a=Array(n*n).fill(-1),R=[],C=[];
  for(let i=0;i<n;i++){R.push([0,0]);C.push([0,0])}
  const nb={};cs.forEach(([x,y,t])=>(nb[y]=nb[y]||[]).push([x,t]));
  let c=0,s=null;
  const go=i=>{if(c>=lim)return;if(i==n*n){c++;s=s||a.slice();return}
    const y=(i/n)|0,x=i%n,vs=gv[i]>=0?[gv[i]]:(r&&r()<.5?[1,0]:[0,1]);
    for(const v of vs){
      if(R[y][v]>=n/2||C[x][v]>=n/2)continue;
      if(x>1&&a[i-1]==v&&a[i-2]==v)continue;
      if(y>1&&a[i-n]==v&&a[i-2*n]==v)continue;
      if((nb[i]||[]).some(([p,t])=>(a[p]==v)==(t==1)))continue;
      a[i]=v;R[y][v]++;C[x][v]++;go(i+1);R[y][v]--;C[x][v]--;a[i]=-1;if(c>=lim)return}};
  go(0);return{c,sol:s}}

function bad(){const b=new Set(),h=n/2;
  for(let i=0;i<n*n;i++){const v=g[i];if(v<0)continue;const y=(i/n)|0,x=i%n;
    if(x>1&&g[i-1]==v&&g[i-2]==v)[i,i-1,i-2].forEach(j=>b.add(j));
    if(y>1&&g[i-n]==v&&g[i-2*n]==v)[i,i-n,i-2*n].forEach(j=>b.add(j))}
  for(let k=0;k<n;k++)for(const v of[0,1]){const rr=[],cc=[];
    for(let j=0;j<n;j++){if(g[k*n+j]==v)rr.push(k*n+j);if(g[j*n+k]==v)cc.push(j*n+k)}
    if(rr.length>h)rr.forEach(j=>b.add(j));if(cc.length>h)cc.forEach(j=>b.add(j))}
  cons.forEach(([a,c,t])=>{if(g[a]>=0&&g[c]>=0&&((g[a]==g[c])==(t==1))){b.add(a);b.add(c)}});
  return b}

function render(){const G=$('#g'),kb={};
  G.style.setProperty('--n',n);G.style.gridTemplateColumns=`repeat(${n},1fr)`;
  cons.forEach(([a,b,t])=>kb[a]=(kb[a]||'')+`<i class="k ${b==a+1?'r':'d'}">${t?'×':'='}</i>`);
  G.innerHTML=g.map((v,i)=>`<div class="c${giv[i]>=0?' g':''}" data-i="${i}">${v==0?'☀️':v==1?'🌙':''}${kb[i]||''}</div>`).join('');
  $('#lv').textContent=lvl}

function check(){if(lock||g.some(v=>v<0)||bad().size)return;lock=true;
  const G=$('#g');G.classList.add('cheer');
  [...G.children].forEach((e,i)=>e.style.setProperty('--i',i%n+((i/n)|0)));
  setTimeout(()=>{G.classList.remove('cheer');lock=false;$('#win').classList.add('on')},1400)}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('t_lvl',lvl)}catch(e){}
  const r=rng(lvl*92821+5),sh=a=>a.sort(()=>r()-.5);n=lvl<5?4:6;
  const full=solve(n,Array(n*n).fill(-1),[],1,r).sol;
  const items=[];
  for(let i=0;i<n*n;i++){items.push({k:'g',i});if(i%n<n-1)items.push({k:'c',a:i,b:i+1});if(i<n*n-n)items.push({k:'c',a:i,b:i+n})}
  sh(items);
  const build=u=>{const gv=Array(n*n).fill(-1),cs=[];
    u.forEach(it=>{if(it.k=='g')gv[it.i]=full[it.i];else cs.push([it.a,it.b,full[it.a]==full[it.b]?0:1])});
    return[gv,cs]};
  const uniq=u=>{const[gv,cs]=build(u);return solve(n,gv,cs,2).c==1};
  let use=[];
  for(const it of items){use.push(it);if(use.length>=3&&uniq(use))break}
  const p=Math.min(.9,.12*lvl);
  for(const it of sh(use.slice())){if(r()<p){const t=use.filter(x=>x!=it);if(uniq(t))use=t}}
  [giv,cons]=build(use);sol=full;g=giv.slice();hist=[];
  $('#win').classList.remove('on');render()}

$('#g').onclick=e=>{const d=e.target.closest('.c');if(!d||lock)return;
  const i=+d.dataset.i;if(giv[i]>=0)return;
  hist.push(g.slice());g[i]=g[i]==1?-1:g[i]+1;render();check()};
$('#undo').onclick=()=>{if(hist.length&&!lock){g=hist.pop();render()}};
$('#redo').onclick=()=>{if(lock)return;hist.push(g.slice());g=giv.slice();render()};
$('#prev').onclick=()=>load(lvl-1);
$('#next').onclick=()=>load(lvl+1);
$('#go').onclick=()=>load(lvl+1);
$('#hint').onclick=()=>{if(lock)return;
  let i=g.findIndex((v,k)=>v>=0&&v!=sol[k]);if(i<0)i=g.findIndex(v=>v<0);if(i<0)return;
  hist.push(g.slice());g[i]=sol[i];render();check()};
load(lvl);
</script>
</body>
</html>
