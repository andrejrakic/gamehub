<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simon</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🔴</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button,.home{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:22px;line-height:1;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
@keyframes hop{40%{transform:translateY(-10px) scale(1.08)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--s:min(88vw,400px)}
#g{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:var(--s);margin:26px auto 10px}
.pd{aspect-ratio:1;border-radius:28px;border:0;background:var(--c);opacity:.42;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25);transition:opacity .08s,transform .08s;padding:0}
.pd.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 34px var(--c),inset 0 -8px 0 rgba(0,0,0,.18)}
#st{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;border:0;background:#fff;color:#1d2b3d;font-size:36px;z-index:2;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#pr{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;width:var(--s);margin:10px auto 24px}
#pr i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}
#pr i.d{background:#43c25a}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cheer .pd{animation:hop .6s ease both}

</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<div id="g"></div><div id="pr"></div>
<div id="win"><div class="big">🎵</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const $=s=>document.querySelector(s);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const SC=['#e53935','#43a047','#fdd835','#1e88e5'],FQ=[262,330,392,523];
let lvl=1,att=0,seq=[],T=3,k=1,idx=0,phase='idle',tok=0,snd=true,ac=null,on=600;
try{lvl=Math.max(1,+localStorage.getItem('o_lvl')||1)}catch(e){}
const G=$('#g');

function tone(f,ms){if(!snd)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+ms/1000);o.stop(ac.currentTime+ms/1000)}catch(e){}}
function lit(p,ms){const e=G.children[p];if(e)e.classList.add('lit');tone(FQ[p],ms);
  setTimeout(()=>{if(e)e.classList.remove('lit')},ms)}

function dots(){$('#pr').innerHTML=[...Array(T)].map((_,i)=>`<i class="${i<k-1?'d':''}"></i>`).join('')}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('o_lvl',lvl)}catch(e){}
  const r=rng(lvl*8191+att*37+3);T=Math.min(3+lvl,16);on=Math.max(600-lvl*15,320);
  seq=[...Array(T)].map(()=>r()*4|0);k=1;idx=0;phase='idle';tok++;
  G.classList.remove('cheer');
  G.innerHTML=SC.map((c,i)=>`<button class="pd" data-i="${i}" style="--c:${c}" aria-label="pad"></button>`).join('')+'<button id="st">▶</button>';
  $('#win').classList.remove('on');dots();$('#lv').textContent=lvl}

function play(){const my=++tok;phase='show';const s=$('#st');if(s)s.style.display='none';let i=0;
  const step=()=>{if(my!=tok)return;if(i>=k){phase='input';idx=0;return}const p=seq[i++];lit(p,on);setTimeout(step,on+220)};
  setTimeout(step,500)}

// returns what happened, so it is easy to test
function pad(p){if(phase!='input')return 'ignored';lit(p,200);
  if(p!=seq[idx]){phase='show';tok++;G.classList.add('shake');tone(110,400);
    setTimeout(()=>{G.classList.remove('shake');play()},900);return 'wrong'}
  idx++;if(idx<k)return 'ok';
  if(k==T){phase='done';G.classList.add('cheer');dots();setTimeout(()=>{G.classList.remove('cheer');$('#win').classList.add('on')},1200);return 'win'}
  k++;idx=0;phase='show';dots();setTimeout(play,800);return 'round'}

G.onpointerdown=e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
  if(b.id=='st'){play();return}pad(+b.dataset.i)};
$('#undo').textContent='🔊';
$('#undo').onclick=()=>{snd=!snd;$('#undo').textContent=snd?'🔊':'🔇'};
$('#hint').onclick=()=>{if(phase=='input'||phase=='idle')play()};
$('#redo').onclick=()=>{att++;load(lvl)};
$('#prev').onclick=()=>{att=0;load(lvl-1)};
$('#next').onclick=()=>{att=0;load(lvl+1)};
$('#go').onclick=()=>{att=0;load(lvl+1)};
load(lvl);

</script>
</body>
</html>
