<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patches</title>
<meta name="theme-color" content="#1d2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🟦</text></svg>">
<style>
:root{--bg:#1d2b3d;--fg:#fff;--btn:#33506f;--ok:#43c25a;--s:min(94vw,480px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1d2b3d}}
:root[data-theme="dark"]{--bg:#1d2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px 4px;flex-wrap:wrap}
.top button,.home{width:46px;height:46px;border-radius:50%;border:0;background:var(--btn);color:var(--fg);font-size:22px;line-height:1;
display:flex;align-items:center;justify-content:center;text-decoration:none}
.top button:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:800;min-width:84px;justify-content:center}
.lvl button{width:40px;height:40px;font-size:16px}
#b{display:block;width:var(--s);height:var(--s);margin:26px auto;touch-action:none}
.pr{transform-box:fill-box;transform-origin:center}
#b.won .pr{animation:bump .6s ease both}
@keyframes bump{40%{transform:scale(1.12)}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,18,30,.88);gap:12px;z-index:9}
#win.on{display:flex}
#win .big{font-size:96px;animation:pop .6s}
#win .st{font-size:44px;letter-spacing:6px}
#win button{width:96px;height:96px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:44px;margin-top:16px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="index.html">🏠</a>
  <button id="undo" aria-label="undo">↶</button>
  <button id="hint" aria-label="hint">💡</button>
  <div class="lvl"><button id="prev">◀</button><span id="lv">1</span><button id="next">▶</button></div>
  <button id="redo" aria-label="restart">↻</button>
</div>
<svg id="b"></svg>
<div id="win"><div class="big">🟦</div><div class="st">⭐⭐⭐</div><button id="go">▶</button></div>
<script>
const $=s=>document.querySelector(s),B=$('#b');
let lvl=1,n=4,cl=[],pl=[],hist=[],dr=null,lock=false;
try{lvl=Math.max(1,+localStorage.getItem('p_lvl')||1)}catch(e){}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// every clue number = area of the rectangle that must contain it
function cand(c){return c.map((k,i)=>{const o=[];
  for(let w=1;w<=k.num;w++){if(k.num%w)continue;const h=k.num/w;
    for(let x=k.x-w+1;x<=k.x;x++)for(let y=k.y-h+1;y<=k.y;y++){
      if(x<0||y<0||x+w>n||y+h>n)continue;
      if(c.some((q,j)=>j!=i&&q.x>=x&&q.x<x+w&&q.y>=y&&q.y<y+h))continue;
      o.push([x,y,w,h])}}
  return o})}

function count(c){const cs=cand(c),occ=Array(n*n).fill(0),used=Array(c.length).fill(false);let k=0;
  const mark=(x,y,w,h,v)=>{for(let a=y;a<y+h;a++)for(let b=x;b<x+w;b++)occ[a*n+b]=v};
  const free=(x,y,w,h)=>{for(let a=y;a<y+h;a++)for(let b=x;b<x+w;b++)if(occ[a*n+b])return false;return true};
  const go=()=>{if(k>1)return;const e=occ.indexOf(0);if(e<0){k++;return}
    const ex=e%n,ey=(e/n)|0;
    for(let i=0;i<c.length;i++){if(used[i])continue;
      for(const[x,y,w,h]of cs[i]){
        if(ex<x||ex>=x+w||ey<y||ey>=y+h||!free(x,y,w,h))continue;
        used[i]=true;mark(x,y,w,h,1);go();used[i]=false;mark(x,y,w,h,0);if(k>1)return}}};
  go();return k}

function gen(L){const r=rng(L*130363+9);n=Math.min(4+((L-1)/5|0),8);
  const mx=3+(L-1)%5;let best;
  for(let t=0;t<80;t++){const rs=[];
    const sp=(x,y,w,h)=>{
      if(w*h>1&&(w*h>mx||r()<.12)){
        if(w>1&&(h==1||r()<w/(w+h))){const c=1+(r()*(w-1)|0);sp(x,y,c,h);sp(x+c,y,w-c,h)}
        else{const c=1+(r()*(h-1)|0);sp(x,y,w,c);sp(x,y+c,w,h-c)}}
      else rs.push([x,y,w,h])};
    sp(0,0,n,n);
    best=rs.map(([x,y,w,h])=>({x:x+(r()*w|0),y:y+(r()*h|0),num:w*h,sol:[x,y,w,h]}));
    if(best.length>=3&&count(best)==1)return best}
  return best}

const box=d=>({x:Math.min(d.x1,d.x2),y:Math.min(d.y1,d.y2),w:Math.abs(d.x1-d.x2)+1,h:Math.abs(d.y1-d.y2)+1});
const clr=i=>`hsl(${(i*47+10)%360} 70% 66%)`;

function render(){let s='';B.setAttribute('viewBox',`0 0 ${n} ${n}`);
  for(let i=0;i<n*n;i++){const x=i%n,y=(i/n)|0;
    s+=`<rect x="${x+.04}" y="${y+.04}" width=".92" height=".92" rx=".12" fill="${(x+y)%2?'#2b4058':'#34495f'}"/>`}
  pl.forEach((p,k)=>{s+=`<g class="pr" style="animation-delay:${k*.1}s"><rect x="${p.x+.05}" y="${p.y+.05}" width="${p.w-.1}" height="${p.h-.1}" rx=".18" fill="${clr(p.i)}"/></g>`});
  if(dr){const r=box(dr);
    s+=`<rect x="${r.x+.05}" y="${r.y+.05}" width="${r.w-.1}" height="${r.h-.1}" rx=".18" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width=".06" stroke-dasharray=".2 .12"/>`}
  cl.forEach(k=>{s+=`<circle cx="${k.x+.5}" cy="${k.y+.5}" r=".3" fill="#fff"/><text x="${k.x+.5}" y="${k.y+.64}" font-size=".4" font-weight="800" fill="#12202f" text-anchor="middle">${k.num}</text>`});
  B.innerHTML=s;$('#lv').textContent=lvl}

function put(r,i){pl=pl.filter(p=>p.x>=r.x+r.w||p.x+p.w<=r.x||p.y>=r.y+r.h||p.y+p.h<=r.y);pl.push({x:r.x,y:r.y,w:r.w,h:r.h,i})}

function check(){if(lock||pl.length!=cl.length)return;lock=true;B.classList.add('won');
  setTimeout(()=>{B.classList.remove('won');lock=false;$('#win').classList.add('on')},1500)}

function load(L){lvl=Math.max(1,L);try{localStorage.setItem('p_lvl',lvl)}catch(e){}
  cl=gen(lvl);pl=[];hist=[];dr=null;$('#win').classList.remove('on');render()}

const cell=e=>{const r=B.getBoundingClientRect();
  return[Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n))),Math.max(0,Math.min(n-1,Math.floor((e.clientY-r.top)/r.height*n)))]};

B.onpointerdown=e=>{if(lock)return;e.preventDefault();B.setPointerCapture(e.pointerId);
  const[x,y]=cell(e);dr={x1:x,y1:y,x2:x,y2:y};render()};
B.onpointermove=e=>{if(!dr)return;const[x,y]=cell(e);if(x!=dr.x2||y!=dr.y2){dr.x2=x;dr.y2=y;render()}};
B.onpointerup=()=>{if(!dr)return;const r=box(dr);dr=null;
  const cov=pl.findIndex(p=>r.x>=p.x&&r.x<p.x+p.w&&r.y>=p.y&&r.y<p.y+p.h);
  if(r.w*r.h==1&&cov>=0){hist.push(pl.slice());pl.splice(cov,1)}
  else{const ins=cl.map((k,i)=>[k,i]).filter(([k])=>k.x>=r.x&&k.x<r.x+r.w&&k.y>=r.y&&k.y<r.y+r.h);
    if(ins.length==1&&ins[0][0].num==r.w*r.h){hist.push(pl.slice());put(r,ins[0][1])}}
  render();check()};
B.onpointercancel=()=>{dr=null;render()};

$('#undo').onclick=()=>{if(hist.length&&!lock){pl=hist.pop();render()}};
$('#redo').onclick=()=>{if(lock)return;hist.push(pl.slice());pl=[];render()};
$('#prev').onclick=()=>load(lvl-1);
$('#next').onclick=()=>load(lvl+1);
$('#go').onclick=()=>load(lvl+1);
$('#hint').onclick=()=>{if(lock)return;
  const i=cl.findIndex((k,i)=>!pl.some(p=>p.i==i&&p.x==k.sol[0]&&p.y==k.sol[1]&&p.w==k.sol[2]&&p.h==k.sol[3]));
  if(i<0)return;hist.push(pl.slice());const[x,y,w,h]=cl[i].sol;put({x,y,w,h},i);render();check()};
load(lvl);
</script>
</body>
</html>
